<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>donkeycorn.co</title>
  <meta name="description" content="donkeycorn.co — startup advisory, seed and angel investing.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="donkeycorn.co">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://donkeycorn.co/">
  <meta property="og:image" content="https://donkeycorn.co/assets/donkeycorn.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --graphite: #2b2d31;
      --orange: #ea8a52;
    }
    :root[data-theme="dark"] {
      --bg: #1b1c1f;
      --graphite: #ece8e1;
    }
    :root[data-theme="dark"] .art-light { display: none; }
    :root[data-theme="dark"] .art-dark { display: block; }
    :root[data-theme="dark"] .icon-moon { display: none; }
    :root[data-theme="dark"] .icon-sun { display: block; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--graphite);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(20px, 4vh, 40px);
    }
    img {
      display: block;
      width: auto;
      height: min(56vh, 520px);
      max-width: 80vw;
      object-fit: contain;
    }
    h1 {
      margin: 0;
      font-weight: 700;
      font-size: clamp(2rem, 7vw, 3.75rem);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    h1 span { color: var(--orange); }
    .art-dark, .icon-sun { display: none; }
    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--graphite);
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.15s;
    }
    .theme-toggle:hover, .theme-toggle:focus-visible { opacity: 1; }
    .theme-toggle:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
    .theme-toggle svg { width: 22px; height: 22px; }
  </style>
  <script>
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <main>
    <img class="art-light" src="assets/donkeycorn.png" alt="A donkey with a carrot for a unicorn horn" width="480" height="800">
    <img class="art-dark" src="assets/donkeycorn-dark.png" alt="A donkey with a carrot for a unicorn horn" width="480" height="800" loading="lazy">
    <h1>donkeycorn<span>.co</span></h1>
  </main>
  <script>
    (function () {
      var root = document.documentElement;
      function isDark() { return root.dataset.theme === "dark"; }
      function syncThemeColor() {
        var bg = getComputedStyle(root).getPropertyValue("--bg").trim();
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = bg; });
      }
      document.querySelector(".theme-toggle").addEventListener("click", function () {
        var next = isDark() ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        syncThemeColor();
      });
      if (root.dataset.theme) syncThemeColor();
    })();
  </script>
</body>
</html>
